# Everything in dist/ is generated from code in this directory; nothing here is drawn or
# downloaded by hand. Rebuild instead of editing.
source: generated
generator: code
derived:
  - files: [fox.png, fox-outlined.png, fox.sheet.json, pet-data.js]
    from: sprites/fox.json
    by: node tools/build.mjs
  - files: [arctic-fox.png, arctic-fox-outlined.png, arctic-fox.sheet.json]
    from: sprites/arctic-fox.json (written by tools/assemble_arctic_fox.py from the fox generator)
    by: node tools/build.mjs
  - files: [dachshund.png, dachshund-outlined.png, dachshund.sheet.json]
    from: sprites/dachshund.json (written by tools/assemble_dachshund.py)
    by: node tools/build.mjs
  - files: [corgi.png, corgi-outlined.png, corgi.sheet.json]
    from: sprites/corgi.json (written by tools/assemble_corgi.py)
    by: node tools/build.mjs
  - files: [penguin.png, penguin-outlined.png, penguin.sheet.json]
    from: sprites/penguin.json (written by tools/assemble_penguin.py)
    by: node tools/build.mjs
  - files: [hamster.png, hamster-outlined.png, hamster.sheet.json]
    from: sprites/hamster.json (written by tools/assemble_hamster.py)
    by: node tools/build.mjs
  - files: [fox-all-animations.mp4]
    from: sprites/fox.json
    by: tools/render_video.py fox (Pillow, numpy, ffmpeg)
  - files: [arctic-fox-all-animations.mp4]
    from: sprites/arctic-fox.json
    by: tools/render_video.py arctic-fox (Pillow, numpy, ffmpeg)
  - files: [corgi-all-animations.mp4]
    from: sprites/corgi.json
    by: tools/render_video.py corgi (Pillow, numpy, ffmpeg)
  - files: [penguin-all-animations.mp4]
    from: sprites/penguin.json
    by: tools/render_video.py penguin (Pillow, numpy, ffmpeg)
  - files: [hamster-all-animations-beach.mp4]
    from: sprites/hamster.json
    by: tools/render_video.py hamster beach (Pillow, numpy, ffmpeg)
license: original work
created: 2026-09-28
